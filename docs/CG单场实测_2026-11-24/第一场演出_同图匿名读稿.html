<head>

<title>第一场演出 · 同图读稿</title>
<style>
:root { --bg:#f6f4ef; --panel:#fffdf8; --ink:#25231f; --muted:#726b60; --line:#d8d1c3; --accent:#8b4f2d; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; }
header { position:sticky; top:0; z-index:5; background:rgba(246,244,239,.96); border-bottom:1px solid var(--line); padding:18px 24px; backdrop-filter:blur(8px); }
h1 { margin:0 0 6px; font-size:22px; }
.sub { color:var(--muted); font-size:14px; }
main { max-width:1040px; margin:0 auto; padding:22px 18px 80px; }
.pair { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin:18px 0; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.pair h2 { margin:0 0 4px; font-size:18px; }
.pair .id { color:var(--muted); font-size:12px; }
.versions { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0; }
@media (max-width:760px) { .versions { grid-template-columns:1fr; } }
.version { border:1px solid var(--line); border-radius:9px; padding:13px; background:#fff; }
.version h3 { margin:0 0 8px; font-size:15px; color:var(--accent); }
.text { white-space:pre-wrap; font-size:15px; line-height:1.75; }
.dim { display:grid; grid-template-columns:8.5em 1fr 2em; gap:8px; align-items:center; margin:5px 0; font-size:14px; }
.dim label { color:var(--muted); }
input[type=range] { width:100%; accent-color:var(--accent); }
.val { text-align:right; font-variant-numeric:tabular-nums; }
.choice { margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
.choice label { cursor:pointer; }
textarea { width:100%; min-height:44px; margin-top:8px; border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; background:#fff; }
footer { position:fixed; bottom:0; left:0; right:0; background:rgba(246,244,239,.97); border-top:1px solid var(--line); padding:10px 24px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
button { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:9px 15px; font:inherit; cursor:pointer; }
button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
#status { color:var(--muted); font-size:13px; }
</style>
</head>

<script>
const PAIRS = [{"id": "stage46", "title": "第 46 天，打烊前", "jia": "埃莉诺　我妈今天来过了？\n\n店主　嗯。她说你小时候一唱，满屋子都听得见。\n\n埃莉诺　隔两间屋她都要我再大点声。你少信她。\n\n店主　那我信谁？\n\n埃莉诺　你收你的。等会儿自己来听。\n\n（你收好最后一笔钱。下层小台那边响了半句歌，麦克风忽然哑了。）\n\n店主　最后那个字，我没听着。\n\n（她看见你，拿麦的手往回收了收。这次她从头唱，一直唱到你刚才没听见的地方。）\n\n【图上】埃莉诺　……这回听清了？\n\n店主　听清了。刚才少听了半首，倒是赚了。", "yi": "埃莉诺　（手掌拍了两下窗台）喂，挡板先别放。\n\n埃莉诺　我母亲下午来过，对吧？拎了一大包日用品回去。\n\n店主　来过。\n\n埃莉诺　她回家一边拆包一边跟我交代，说她在你窗口多嘴了。\n\n埃莉诺　说我小时候唱得满屋都是，后来知道害臊，就不唱了。\n\n埃莉诺　荒谬。我那是长大了，嗓子得省着用。\n\n埃莉诺　（弯腰从脚边拎起一支缠着线的麦克风）管线底下那个小台子，今晚我借到半小时。\n\n埃莉诺　账我上午对完了，库房那几箱也认过货。这半小时算我自己的。\n\n埃莉诺　你锁好门过来。站后头，别站太近。\n\n（管线下的小台子亮着一盏灯，埃莉诺把麦克风线在手腕上绕了两圈。）\n\n埃莉诺　（指尖敲了敲麦克风头）喂。喂。\n\n埃莉诺　这东西有杂音，你听出来没有？\n\n店主　有一点。\n\n埃莉诺　行吧，下层区的东西，响就算合格。\n\n埃莉诺　（拽了拽背心下摆，又松开）别盯着衣服。我没空回去换。\n\n埃莉诺　还有，别指望我唱我母亲说的那首。那是小孩子唱的。\n\n店主　你唱你选的。\n\n埃莉诺　本来就是我选的。用不着你批准。\n\n埃莉诺　（低头踢开台边一截线头）第一句我可能起高。起高了你也不许笑。\n\n埃莉诺　（开口唱了半句，自己停住）……不对。重来。\n\n（她重新起调，这回一直唱到末尾，最后一个音压得很低，麦克风跟着嗡了一下。）\n\n埃莉诺　（把麦克风从嘴边挪开，喘了口气）……呼。\n\n埃莉诺　上午在库房，我哼了两句，你回头问我说什么。\n\n埃莉诺　我跟你说没什么。\n\n埃莉诺　（攥着麦克风线，没有下台）\n\n【图上】埃莉诺　……这回听清了？\n\n可选回应\n\n　· 说听清了\n\n　· 请她再唱\n\n　· 只点了点头\n\n店主　听清了。每一句。\n\n埃莉诺　每一句？少来。第一句我明明起高了。\n\n店主　重来的那句也听清了。\n\n埃莉诺　（别开脸，看向头顶的管线）……行吧。\n\n埃莉诺　你要是说好听，我反倒不信。你说听清了，我就信。\n\n埃莉诺　母亲那边，你别跟她提我唱了。她会先哭，然后跟整条街讲。\n\n埃莉诺　（弯腰把线一圈圈收回手腕，背心领口往下坠，她抬手按住）看什么。去把台边那盏灯关了。\n\n店主　嗯。\n\n埃莉诺　下回我穿那条礼服来试。到时候你还站后头，位置不许变。\n\n埃莉诺　（跳下台子，经过你身边时停了一下）走吧。门锁好了没？\n\n其余选项的回应\n\n选“请她再唱”\n\n店主　再唱一遍。\n\n埃莉诺　呵，你倒是会提要求。\n\n埃莉诺　（还是把麦克风举了回去，唱完最后一段）唱完了。这回总该开口了吧。\n\n\n选“只点了点头”\n\n埃莉诺　点头算什么？我站在上面看不清你。\n\n埃莉诺　（麦克风往前递了递）用嘴说。"}];

    root.appendChild(el);
  });
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function setRating(id, side, dim, val) { ensure(id).ratings[side][dim] = Number(val); save(); }
function setChoice(id, val) { ensure(id).choice = val; save(); }
function setNotes(id, val) { ensure(id).notes = val; save(); }
function resetAll() { if (!confirm("清空本页所有评分？")) return; state = {}; localStorage.removeItem(KEY); render(); document.getElementById("status").textContent = "已清空"; }
function download() {
  const reader = prompt("你的名字/代号（可留空）", "") || "";
  const responses = PAIRS.map(p => {
    const st = ensure(p.id);
    return {pair_id:p.id, jia: st.ratings.jia, yi: st.ratings.yi, choice: st.choice || "tie", notes: st.notes || ""};
  });
  const data = {reader: reader, submitted_utc: new Date().toISOString(), responses: responses};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "responses_" + (reader || "reader") + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById("status").textContent = "已生成 responses.json";
}
render();
</script>
